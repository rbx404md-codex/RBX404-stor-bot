name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found!"
            exit 1
          fi

          echo "✅ Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "===== EXTRACTED CONTENT ====="
          find extracted -maxdepth 3 -type f \
            ! -path "*/.git/*" | head -100

      - name: Copy project
        shell: bash
        run: |
          PROJECT_DIR="extracted/RBX404-Digital-Store-Bot"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "❌ Project folder not found!"
            echo "Available folders:"
            find extracted -maxdepth 2 -type d
            exit 1
          fi

          echo "📦 Copying project files..."

          cp -a "$PROJECT_DIR"/. . \
            --no-preserve=ownership

          echo "🧹 Removing ZIP's Git metadata..."

          rm -rf .git/modules
          
          echo "✅ Project copied."

      - name: Remove ZIP
        shell: bash
        run: |
          rm -f "${{ steps.zip.outputs.zip_file }}"

      - name: Verify Git repository
        shell: bash
        run: |
          if [ ! -d ".git" ]; then
            echo "⚠️ Git metadata missing. Reinitializing..."

            git init
            git remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

            git fetch origin main
            git checkout -B main origin/main
          fi

          echo "✅ Git repository verified."
          git status

      - name: Commit and Push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
            exit 0
          fi

          git commit -m "Extract RBX404 Digital Store Bot"

          git push origin HEAD:main
