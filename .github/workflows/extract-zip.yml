name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found!"
            exit 1
          fi

          echo "✅ ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "===== ZIP CONTENT ====="
          find extracted -maxdepth 3 -type f \
            ! -path "*/.git/*" | head -100

      - name: Copy project files
        run: |
          shopt -s dotglob nullglob

          ROOT="extracted/RBX404-Digital-Store-Bot"

          if [ ! -d "$ROOT" ]; then
            echo "❌ Project folder not found!"
            find extracted -maxdepth 2 -type d
            exit 1
          fi

          echo "📦 Copying project files..."

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$ROOT/" ./

          echo "✅ Project files copied."

      - name: Remove ZIP and unwanted Git files
        run: |
          rm -f "${{ steps.zip.outputs.zip_file }}"
          rm -rf .git/modules
          rm -rf .git/objects
          
          echo "Cleanup completed."

      - name: Show final structure
        run: |
          echo "===== FINAL PROJECT ====="
          find . -maxdepth 3 \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -type f | sort | head -200

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit."
            exit 0
          fi

          git commit -m "Extract RBX404 Digital Store Bot"

          git push origin HEAD:main
