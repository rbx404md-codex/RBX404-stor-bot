name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "RBX404-Digital-Store-Bot.zip" -d extracted

      - name: Move files to repository root
        run: |
          shopt -s dotglob

          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && \
             [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d | head -1)" ]; then
            INNER_DIR="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -1)"
            cp -r "$INNER_DIR"/* . 2>/dev/null || true
            cp -r "$INNER_DIR"/.[!.]* . 2>/dev/null || true
          else
            cp -r extracted/* . 2>/dev/null || true
            cp -r extracted/.[!.]* . 2>/dev/null || true
          fi

          rm -rf extracted
          rm -f "RBX404-Digital-Store-Bot.zip"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract RBX404 Digital Store Bot"
            git push
          fi
