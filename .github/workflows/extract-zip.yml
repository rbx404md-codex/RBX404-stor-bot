name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 3 -type f | head -100

      - name: Move files to root
        run: |
          shopt -s dotglob nullglob

          # If ZIP contains one main folder, use its contents
          ITEMS=(extracted/*)

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            echo "Single root folder detected: ${ITEMS[0]}"
            cp -a "${ITEMS[0]}"/. .
          else
            echo "Multiple root items detected"
            cp -a extracted/. .
          fi

          rm -rf extracted

      - name: Remove ZIP
        run: |
          rm -f "${{ steps.zip.outputs.zip_file }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract project ZIP"
            git push
          fi
