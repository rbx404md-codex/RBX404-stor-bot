name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Find ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found!"
            exit 1
          fi

          echo "✅ Found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "✅ ZIP extracted"

      - name: Copy project files
        run: |
          PROJECT_DIR="extracted/RBX404-Digital-Store-Bot"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "❌ Project folder not found!"
            find extracted -maxdepth 2 -type d
            exit 1
          fi

          echo "📦 Copying project files..."

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$PROJECT_DIR/" ./

          echo "✅ Project files copied successfully."

      - name: Remove ZIP
        run: |
          rm -f "${{ steps.zip.outputs.zip_file }}"

      - name: Verify
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -type f | sort | head -200

          echo ""
          echo "===== GIT STATUS ====="
          git status

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
            exit 0
          fi

          git commit -m "Extract RBX404 Digital Store Bot"

          git push origin HEAD:main
