services:
  rbx404-bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8099}:8099"
    volumes:
      - rbx404-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rbx404-data: